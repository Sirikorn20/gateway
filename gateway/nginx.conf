events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    server_tokens off;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location /api/menu {
      proxy_pass http://menu:8000;
    }

    location /api/orders {
      proxy_pass http://order:8000;
    }

    location = / {
      default_type text/plain;
      return 200 "CanteenGo (split): try /api/menu and /api/orders\n";
    }
  }
}